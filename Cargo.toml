[package]
name = "tezbar-notion"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
fixture = []

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "1a11afc14693cc6463e0b95ae7d61991b4a60427" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
scraper = { version = "=0.29.0", default-features = false }

[profile.dev]
debug = 0

[profile.release]
strip = true
